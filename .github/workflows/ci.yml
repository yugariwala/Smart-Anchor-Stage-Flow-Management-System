name: CI / CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Public browser configuration is compiled into the Vite bundle. Both verification
# and deployment need it; .env.local is intentionally absent from Git checkouts.
env:
  VITE_API_BASE_URL: https://cuepilot-api-production.cuepilot-api.workers.dev/v1
  VITE_FIREBASE_API_KEY: AIzaSyB-qYmCzgdmfzoZeT7AWJw3EOqVOs_iFVg
  VITE_FIREBASE_AUTH_DOMAIN: smart-anchor-stage-flow-system.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: smart-anchor-stage-flow-system
  VITE_FIREBASE_APP_ID: 1:1015661485156:web:999ba3988c4c920eae5371

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build & Deploy to Firebase Hosting
        run: npm run deploy:web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}


